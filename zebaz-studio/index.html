<!DOCTYPE html><html lang="ku" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZEBAZ Studio | Booking</title><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:Arial,Tahoma,sans-serif}.hidden{display:none!important}.lang-screen{position:fixed;inset:0;z-index:99;background:radial-gradient(circle at top,#292314,#080808 45%,#000);display:flex;align-items:center;justify-content:center;padding:20px}.lang-box{text-align:center;width:min(650px,100%)}.logo{font-size:clamp(52px,14vw,95px);font-weight:1000;letter-spacing:8px}.lang-box p{color:#aaa}.langs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:28px}.lang{background:#111;border:1px solid #333;border-radius:20px;padding:22px;color:#fff;font-size:16px;font-weight:900;cursor:pointer}.flag{display:block;font-size:34px;margin-bottom:8px}.top{position:sticky;top:0;z-index:10;background:#050505e8;border-bottom:1px solid #222}.nav,.container{width:min(1050px,92%);margin:auto}.nav{height:68px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:24px;font-weight:1000;letter-spacing:3px}.gold{color:#d7b66d}.change{background:#111;border:1px solid #333;color:#fff;border-radius:999px;padding:9px 13px}.hero{min-height:55vh;display:flex;align-items:center;background:radial-gradient(circle at 75% 20%,#282113,#090909 38%,#050505 65%)}.hero h1{font-size:clamp(43px,8vw,82px);line-height:1;margin:0;max-width:850px}.hero p{color:#aaa;font-size:18px;line-height:1.9;max-width:700px}.cta,.submit{background:#d7b66d;color:#070707;border:0;border-radius:14px;padding:16px 25px;font-weight:900;text-decoration:none;cursor:pointer}.section{padding:65px 0}.eyebrow{color:#d7b66d;font-weight:900;font-size:13px;letter-spacing:2px}.title{font-size:clamp(31px,5vw,50px);margin:8px 0}.services{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;margin-top:30px}.service{background:#111;border:1px solid #292929;border-radius:24px;padding:27px}.service h3{font-size:23px;margin:14px 0 8px}.service p{color:#999;line-height:1.8}.review{grid-column:1/-1;border-color:#554823}.booking{background:#0c0c0c;border-block:1px solid #222}.card{max-width:760px;margin:28px auto 0;background:#111;border:1px solid #292929;border-radius:26px;padding:28px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{margin-bottom:16px}label{display:block;margin-bottom:8px;font-weight:800}input,select,textarea{width:100%;padding:15px;border-radius:13px;border:1px solid #333;background:#080808;color:#fff;font-size:16px}textarea{min-height:100px}.submit{width:100%;font-size:17px}.submit:disabled{opacity:.55;cursor:not-allowed}.status{margin-top:14px;text-align:center;color:#d7b66d;line-height:1.8}.footer{text-align:center;color:#777;padding:45px}.footer strong{display:block;color:#fff;font-size:23px;letter-spacing:3px}.phones{margin-top:12px;display:flex;gap:10px;justify-content:center;direction:ltr}.phones a{color:#fff;text-decoration:none;border:1px solid #333;padding:10px 14px;border-radius:999px;direction:ltr;unicode-bidi:isolate}@media(max-width:700px){.langs,.services,.grid{grid-template-columns:1fr}.review{grid-column:auto}.card{padding:20px}}</style></head><body>
<div id="langScreen" class="lang-screen"><div class="lang-box"><div class="logo">ZEBAZ</div><p>زمانەکەت هەڵبژێرە • اختر لغتك • Choose your language</p><div class="langs"><button class="lang" onclick="chooseLang('ku')"><span class="flag">☀️</span>کوردی</button><button class="lang" onclick="chooseLang('ar')"><span class="flag">🇮🇶</span>عەرەبی</button><button class="lang" onclick="chooseLang('en')"><span class="flag">🇬🇧</span>English</button></div></div></div>
<div id="site" class="hidden"><header class="top"><div class="nav"><div class="brand">ZEBAZ <span class="gold">STUDIO</span></div><button class="change" onclick="showLanguages()" id="changeLang"></button></div></header><section class="hero"><div class="container"><div class="eyebrow">ZEBAZ STUDIO</div><h1 data-t="hero"></h1><p data-t="heroSub"></p><a href="#book" class="cta" data-t="book"></a></div></section>
<section class="section"><div class="container"><div class="eyebrow" data-t="our"></div><h2 class="title" data-t="services"></h2><div class="services"><div class="service"><div>🛡️</div><h3 data-t="ppf"></h3></div><div class="service"><div>✨</div><h3 data-t="polish"></h3></div><div class="service"><div>🌑</div><h3 data-t="tint"></h3></div><div class="service review"><div>🎥</div><h3 data-t="review"></h3><p data-t="reviewD"></p></div></div></div></section>
<section class="section booking" id="book"><div class="container"><div class="eyebrow" data-t="reserve"></div><h2 class="title" data-t="reserveTitle"></h2><div class="card"><form id="f"><div class="grid"><div class="field"><label data-t="name"></label><input id="name" required></div><div class="field"><label data-t="phone"></label><input id="phone" type="tel" required></div><div class="field"><label data-t="car"></label><input id="car" required></div><div class="field"><label data-t="year"></label><input id="year" required></div></div><div class="field"><label>VIN Number</label><input id="vin" maxlength="17" placeholder="17 characters" required style="direction:ltr;text-transform:uppercase"></div><div class="field"><label data-t="service"></label><select id="service" required><option value="" id="op0"></option><option id="op1"></option><option id="op2"></option><option id="op3"></option><option id="op4"></option></select></div><div class="field"><label data-t="notes"></label><textarea id="notes"></textarea></div><button class="submit" id="submitBtn" type="submit" data-t="send"></button><div class="status" id="status"></div></form></div></div></section><footer class="footer"><strong>ZEBAZ STUDIO</strong><div>Erbil • Kurdistan</div><div class="phones" dir="ltr"><a href="tel:07502122220">0750 212 2220</a><a href="tel:07502122022">0750 212 2022</a></div></footer></div>
<script>
// After deploying the Node backend, replace this with its HTTPS URL.
// Example: https://zebaz-whatsapp.onrender.com
const BACKEND_URL='https://YOUR-NODE-BACKEND.example.com';
const WHATSAPP_RECEIVER='9647502122220';
const T={ku:{hero:'ئۆتۆمبێلەکەت بە شێوەیەکی جیاواز پیشان بدە.',heroSub:'حجز بۆ PPF، پۆلیش، ڕەشکردنی جام و ڕیڤیوی پیشەیی ئۆتۆمبێل لەلایەن Barzan Sleman.',book:'حجز بکە',our:'خزمەتگوزارییەکانمان',services:'خزمەتگوزاری هەڵبژێرە',ppf:'پاراستنی بۆیە (PPF)',polish:'پۆلیش',tint:'ڕەشکردنی جام',review:'ریکلام و ڕیڤیوی ئۆتۆمبێل',reviewD:'Barzan Sleman ڕیڤیوی پیشەیی بۆ ئۆتۆمبێلەکەت دەکات و لە TikTok، Instagram و Facebook نمایشی دەکات.',reserve:'حجز',reserveTitle:'داواکارییەکەت بنێرە',name:'ناوی سیانی',phone:'ژمارەی مۆبایل',car:'جۆر و مۆدێلی ئۆتۆمبێل',year:'ساڵی مۆدێل',service:'خزمەتگوزاری',notes:'تێبینی',send:'ناردنی حجز بۆ WhatsApp',lang:'کوردی ☀️',sending:'داواکارییەکە دەنێردرێت...',sent:'حجزەکەت سەرکەوتووانە بۆ WhatsApp نێردرا ✅',failed:'ناردن سەرکەوتوو نەبوو. Node server پەیوەست نییە.',ops:['هەڵبژێرە','پاراستنی بۆیە (PPF)','پۆلیش','ڕەشکردنی جام','ریکلام و ڕیڤیوی ئۆتۆمبێل']},ar:{hero:'اعرض سيارتك بطريقة مختلفة.',heroSub:'احجز PPF أو التلميع أو تظليل الزجاج أو مراجعة احترافية مع Barzan Sleman.',book:'احجز الآن',our:'خدماتنا',services:'اختر الخدمة',ppf:'حماية الطلاء (PPF)',polish:'تلميع السيارة',tint:'تظليل الزجاج',review:'إعلان ومراجعة السيارة',reviewD:'يقوم Barzan Sleman بمراجعة احترافية لسيارتك وعرضها على TikTok وInstagram وFacebook.',reserve:'الحجز',reserveTitle:'أرسل طلبك',name:'الاسم الكامل',phone:'رقم الهاتف',car:'نوع وموديل السيارة',year:'سنة الموديل',service:'الخدمة',notes:'ملاحظات',send:'إرسال الحجز إلى WhatsApp',lang:'العربية 🇮🇶',sending:'جارٍ إرسال الطلب...',sent:'تم إرسال الحجز إلى WhatsApp بنجاح ✅',failed:'فشل الإرسال. خادم Node غير متصل.',ops:['اختر','حماية الطلاء (PPF)','تلميع السيارة','تظليل الزجاج','إعلان ومراجعة السيارة']},en:{hero:'Show your car differently.',heroSub:'Book PPF, polishing, window tinting, or a professional car review by Barzan Sleman.',book:'Book Now',our:'OUR SERVICES',services:'Choose a service',ppf:'Paint Protection (PPF)',polish:'Car Polishing',tint:'Window Tint',review:'Car Advertising & Review',reviewD:'Barzan Sleman professionally reviews your car and showcases it on TikTok, Instagram and Facebook.',reserve:'BOOKING',reserveTitle:'Send your request',name:'Full Name',phone:'Phone Number',car:'Car Make & Model',year:'Model Year',service:'Service',notes:'Notes',send:'Send Booking to WhatsApp',lang:'English 🇬🇧',sending:'Sending booking...',sent:'Booking sent to WhatsApp successfully ✅',failed:'Sending failed. Node server is not connected.',ops:['Choose','Paint Protection (PPF)','Car Polishing','Window Tint','Car Advertising & Review']}};
let lang='ku';function apply(){document.documentElement.lang=lang;document.documentElement.dir=lang==='en'?'ltr':'rtl';document.querySelectorAll('[data-t]').forEach(x=>x.textContent=T[lang][x.dataset.t]);document.getElementById('changeLang').textContent='🌐 '+T[lang].lang;T[lang].ops.forEach((x,i)=>document.getElementById('op'+i).textContent=x)}function chooseLang(l){lang=l;apply();langScreen.classList.add('hidden');site.classList.remove('hidden')}function showLanguages(){site.classList.add('hidden');langScreen.classList.remove('hidden')}
function getData(){let s=document.getElementById('service');return{name:name.value.trim(),phone:phone.value.trim(),car:car.value.trim(),year:year.value.trim(),vin:vin.value.trim().toUpperCase(),service:s.options[s.selectedIndex].text,notes:notes.value.trim()||'-',date:new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Baghdad',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date()),language:lang}}
function makePdfData(d){const {jsPDF}=window.jspdf;const pdf=new jsPDF();pdf.setFont('helvetica','bold');pdf.setFontSize(24);pdf.text('ZEBAZ STUDIO',20,25);pdf.setFontSize(11);pdf.setFont('helvetica','normal');pdf.text('CAR SERVICE BOOKING',20,34);pdf.line(20,39,190,39);let y=51;[['Date & Time',d.date],['Full Name',d.name],['Phone',d.phone],['Car',d.car],['Model Year',d.year],['VIN',d.vin],['Service',d.service],['Notes',d.notes]].forEach(r=>{pdf.setFont('helvetica','bold');pdf.text(r[0]+':',20,y);pdf.setFont('helvetica','normal');pdf.text(pdf.splitTextToSize(String(r[1]),125),62,y);y+=r[0]==='Notes'?18:11});pdf.line(20,y,190,y);pdf.setFontSize(10);pdf.text('ZEBAZ Studio - Erbil, Kurdistan',20,y+10);pdf.text('0750 212 2220  |  0750 212 2022',20,y+17);return pdf.output('datauristring')}
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const d=getData();if(d.vin.length!==17){alert(lang==='ar'?'يجب أن يتكون VIN من 17 خانة':lang==='en'?'VIN must be 17 characters':'VIN دەبێت 17 پیت/ژمارە بێت');return}const btn=document.getElementById('submitBtn');btn.disabled=true;status.textContent=T[lang].sending;const intro=lang==='ar'?'حجز جديد من موقع ZEBAZ Studio':lang==='en'?'New ZEBAZ Studio booking':'حجزی نوێ لە وێبسایتی ZEBAZ Studio';const message=`${intro}\n\nName: ${d.name}\nPhone: ${d.phone}\nCar: ${d.car}\nYear: ${d.year}\nVIN: ${d.vin}\nService: ${d.service}\nDate & Time: ${d.date}\nNotes: ${d.notes}`;try{if(BACKEND_URL.includes('YOUR-NODE-BACKEND'))throw new Error('Backend URL not configured');const response=await fetch(`${BACKEND_URL}/send-booking`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to:WHATSAPP_RECEIVER,message,pdfBase64:makePdfData(d),filename:`ZEBAZ-Booking-${d.vin}.pdf`})});const result=await response.json();if(!response.ok||!result.ok)throw new Error(result.error||'Send failed');status.textContent=T[lang].sent;document.getElementById('f').reset()}catch(err){console.error(err);status.textContent=T[lang].failed}finally{btn.disabled=false}});apply();langScreen.classList.remove('hidden');site.classList.add('hidden');
</script></body></html>
